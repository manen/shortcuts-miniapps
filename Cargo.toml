[workspace]
resolver = "3"
members = [
	"apps/common",
	"apps/gym",
	"common",
	"host",
	"modules/all",
	"modules/calendar",
	"modules/common",
	"modules/execute",
	"modules/show",
	"utils/db",
]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"

common.path = "./common"
host.path = "./host"

util_db.path = "./utils/db"

module_common.path = "./modules/common"
module_execute.path = "./modules/execute"
module_calendar.path = "./modules/calendar"
module_show.path = "./modules/show"
modules.path = "./modules/all"

app_common.path = "./apps/common"
app_gym.path = "./apps/gym"
